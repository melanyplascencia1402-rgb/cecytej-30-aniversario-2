<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} | 30 años CECyTEJ</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body>
<header class="topbar">
  <a class="brand" href="{{ url_for('inicio') }}"><span class="brand-mark">✦</span><span>CECyTEJ <small>Plantel 08 · Ixtlahuacán del Río</small></span></a>
  <span class="anniversary">30 <small>AÑOS</small></span>
</header>
<main class="page">

  {% endwith %}
  {% block content %}{% endblock %}
</main>
<nav class="bottom-nav">
  <a href="{{ url_for('inicio') }}">⌂<span>Inicio</span></a>
  <a href="{{ url_for('historia') }}">▤<span>Historia</span></a>
  <a href="{{ url_for('voces') }}">♧<span>Voces</span></a>
  <a href="{{ url_for('orgullo') }}">★<span>Logros</span></a>
  <a href="{{ url_for('eventos') }}">▦<span>Eventos</span></a>
  <a href="{{ url_for('futuro') }}">➤<span>Futuro</span></a>
</nav>
</body>
</html>
